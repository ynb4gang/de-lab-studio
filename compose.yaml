name: de-lab-studio
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core","analytics","streaming"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_local_only
      POSTGRES_DB: lab
    ports: ["127.0.0.1:15432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lab -d lab"]
      interval: 10s
      retries: 5
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["analytics"]
    ports: ["127.0.0.1:18123:8123"]
    volumes: [clickhouse_data:/var/lib/clickhouse]
    mem_limit: 2g
    cpus: 2.0
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    profiles: ["batch","lakehouse"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: labadmin
      MINIO_ROOT_PASSWORD: local-development-password-only
    ports: ["127.0.0.1:19000:9000","127.0.0.1:19001:9001"]
    volumes: [minio_data:/data]
    mem_limit: 768m
    cpus: 1.0
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["streaming"]
    ports: ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    mem_limit: 1536m
    cpus: 2.0
volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
